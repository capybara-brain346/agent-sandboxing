<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent eval results</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        background: #0b1020;
        color: #e7edf8;
      }
      body {
        margin: 0;
        padding: 32px;
      }
      main {
        max-width: 960px;
        margin: auto;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 24px;
      }
      p {
        color: #aab6cc;
      }
      input {
        margin: 16px 0 24px;
      }
      #summary {
        display: flex;
        gap: 12px;
        margin-bottom: 20px;
      }
      .stat,
      article {
        border: 1px solid #26324a;
        border-radius: 8px;
        background: #111a2c;
      }
      .stat {
        padding: 12px 16px;
        min-width: 92px;
      }
      .stat strong {
        display: block;
        font-size: 22px;
      }
      #results {
        display: grid;
        gap: 8px;
      }
      article {
        padding: 12px 16px;
      }
      article.pass {
        border-left: 4px solid #39c98a;
      }
      article.fail {
        border-left: 4px solid #ff6b6b;
      }
      header {
        display: flex;
        justify-content: space-between;
        gap: 16px;
      }
      h2 {
        font-size: 14px;
        margin: 0;
      }
      .status {
        font-weight: bold;
      }
      .pass .status {
        color: #39c98a;
      }
      .fail .status {
        color: #ff6b6b;
      }
      details {
        margin-top: 10px;
        color: #aab6cc;
      }
      ul {
        margin: 8px 0 0;
        padding-left: 20px;
      }
      code {
        color: #c9d6f0;
      }
      .empty {
        padding: 24px;
        border: 1px dashed #40506d;
        border-radius: 8px;
        color: #aab6cc;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Agent eval results</h1>
      <p>
        Select <code>.data/evals/agent-service.jsonl</code>. The viewer keeps
        the latest record for each case.
      </p>
      <input
        id="file"
        type="file"
        accept=".jsonl,application/json,text/plain"
      />
      <section id="summary"></section>
      <section id="results" class="empty">No results loaded.</section>
    </main>
    <script>
      const file = document.querySelector("#file");
      const summary = document.querySelector("#summary");
      const results = document.querySelector("#results");

      const text = (value) => document.createTextNode(value);

      const stat = (label, value) => {
        const item = document.createElement("div");
        item.className = "stat";
        const number = document.createElement("strong");
        number.textContent = value;
        item.append(number, text(label));
        return item;
      };

      const details = (result) => {
        const item = document.createElement("details");
        const title = document.createElement("summary");
        title.textContent = "Details";
        const list = document.createElement("ul");
        const failures = result.failures?.length
          ? result.failures
          : ["No assertion failures"];
        const changed = result.transcript
          ? Object.keys({
              ...result.transcript.filesBefore,
              ...result.transcript.filesAfter,
            }).filter(
              (path) =>
                result.transcript.filesBefore[path] !==
                result.transcript.filesAfter[path],
            )
          : [];
        [
          ...failures.map((failure) => `Failure: ${failure}`),
          `Changed files: ${changed.join(", ") || "none"}`,
          `Tools: ${result.transcript?.toolCalls?.join(", ") || "none"}`,
        ].forEach((line) => {
          const entry = document.createElement("li");
          entry.textContent = line;
          list.append(entry);
        });
        item.append(title, list);
        return item;
      };

      const render = (records) => {
        const latest = new Map();
        records.forEach((record) => latest.set(record.name, record));
        const cases = [...latest.values()].sort((left, right) =>
          left.name.localeCompare(right.name),
        );
        const passed = cases.filter((result) => result.passed).length;
        summary.replaceChildren(
          stat("cases", cases.length),
          stat("passed", passed),
          stat("failed", cases.length - passed),
        );
        results.className = "";
        results.replaceChildren(
          ...cases.map((result) => {
            const card = document.createElement("article");
            card.className = result.passed ? "pass" : "fail";
            const header = document.createElement("header");
            const name = document.createElement("h2");
            name.textContent = result.name;
            const status = document.createElement("span");
            status.className = "status";
            status.textContent = result.passed ? "PASS" : "FAIL";
            header.append(name, status);
            card.append(header, details(result));
            return card;
          }),
        );
      };

      file.addEventListener("change", async () => {
        const selected = file.files?.[0];
        if (!selected) return;
        const records = (await selected.text())
          .split("\n")
          .filter(Boolean)
          .flatMap((line) => {
            try {
              return [JSON.parse(line)];
            } catch {
              return [];
            }
          })
          .filter((record) => typeof record.name === "string");
        render(records);
      });
    </script>
  </body>
</html>
