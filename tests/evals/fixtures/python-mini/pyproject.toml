[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acme-tools"
version = "0.1.0"
description = "Small utility package used by repository evaluations."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
acme-tools = "acme_tools.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
