services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agent_sandboxing
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent_sandboxing"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - agent-sandboxing-postgres-data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      LOG_COLOR: ${LOG_COLOR:-auto}
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/agent_sandboxing?schema=public
      FIXTURE_REPO_PATH: /workspace/fixture-repo
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-false}
      LANGFUSE_FLUSH_TIMEOUT_MS: ${LANGFUSE_FLUSH_TIMEOUT_MS:-2000}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      AGENT_MODEL: ${AGENT_MODEL:-openrouter:deepseek/deepseek-v4-flash}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-25}
    ports:
      - "3000:3000"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    command: npm run start:prod
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./repo:/workspace/fixture-repo:ro

  db-migrate:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/agent_sandboxing?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    command: npm run prisma:migrate

volumes:
  agent-sandboxing-postgres-data:
