services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sandbox
      POSTGRES_PASSWORD: sandbox
      POSTGRES_DB: sandbox_service
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sandbox -d sandbox_service"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - sandbox-postgres-data:/var/lib/postgresql/data

volumes:
  sandbox-postgres-data:
